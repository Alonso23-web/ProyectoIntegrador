# Configuracion para TESTS - Usa H2 en memoria
spring.application.name=nuevaases-test

# Base de datos H2 en memoria (no requiere MySQL)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate - Dialecto H2
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 Console (opcional, para depurar)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Thymeleaf
spring.thymeleaf.cache=false

# Server
server.port=8081
server.error.include-message=always
server.error.include-stacktrace=always
server.error.include-binding-errors=always

# Logs - silenciar para tests
logging.level.root=WARN
logging.level.proyecto.nuevaases=INFO
