<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{layout :: head('Registro - Nueva Ases Express')}"></head>
  <body>
    <div th:replace="~{layout :: navbar}"></div>

    <div class="container my-5">
      <div class="row justify-content-center">
        <div class="col-md-7">
          <div
            class="card shadow-lg border-0"
            style="border-radius: 20px; overflow: hidden"
          >
            <div class="card-header bg-primario text-white text-center py-4">
              <img
                th:src="@{/img/logonuevaases.png}"
                alt="Nueva Ases Express"
                style="
                  height: 60px;
                  background: white;
                  padding: 5px;
                  border-radius: 12px;
                  margin-bottom: 1rem;
                "
                onerror="this.style.display = 'none'"
              />
              <h4 class="mb-0 fw-bold">Crear Cuenta</h4>
              <small class="text-white-50"
                >Regístrate como cliente o postula como conductor</small
              >
            </div>
            <div class="card-body p-4">
              <div
                th:if="${error}"
                class="alert alert-danger d-flex align-items-center"
              >
                <i class="bi bi-exclamation-triangle-fill me-2"></i>
                <span th:text="${error}"></span>
              </div>

              <form id="formRegistro" th:action="@{/registro}" method="post" enctype="multipart/form-data">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <div class="row">
                  <div class="col-md-6 mb-3">
                    <label class="form-label fw-bold">Nombre Completo</label>
                    <div class="input-group">
                      <span class="input-group-text bg-light"
                        ><i class="bi bi-person"></i
                      ></span>
                      <input
                        id="nombreCompleto"
                        type="text"
                        name="nombreCompleto"
                        class="form-control"
                        th:value="${usuario != null ? usuario.nombreCompleto : ''}"
                        placeholder="Juan Pérez"
                        required
                      />
                      <div class="invalid-feedback" id="nombreCompletoError"></div>
                    </div>
                  </div>
                  <div class="col-md-6 mb-3">
                    <label class="form-label fw-bold">DNI</label>
                    <div class="input-group">
                      <span class="input-group-text bg-light"
                        ><i class="bi bi-card-text"></i
                      ></span>
                      <input
                        id="dni"
                        type="text"
                        name="dni"
                        class="form-control"
                        th:value="${usuario != null ? usuario.dni : ''}"
                        placeholder="12345678"
                        required
                      />
                      <div class="invalid-feedback" id="dniError"></div>
                    </div>
                  </div>
                </div>
                <div class="row">
                  <div class="col-md-6 mb-3">
                    <label class="form-label fw-bold">Correo Electrónico</label>
                    <div class="input-group">
                      <span class="input-group-text bg-light"
                        ><i class="bi bi-envelope"></i
                      ></span>
                      <input
                        id="email"
                        type="email"
                        name="email"
                        class="form-control"
                        th:value="${usuario != null ? usuario.email : ''}"
                        placeholder="correo@ejemplo.com"
                        required
                      />
                      <div class="invalid-feedback" id="emailError"></div>
                    </div>
                  </div>
                  <div class="col-md-6 mb-3">
                    <label class="form-label fw-bold">Teléfono</label>
                    <div class="input-group">
                      <span class="input-group-text bg-light"
                        ><i class="bi bi-telephone"></i
                      ></span>
                      <input
                        id="telefono"
                        type="tel"
                        name="telefono"
                        class="form-control"
                        th:value="${usuario != null ? usuario.telefono : ''}"
                        placeholder="+51 999 888 777"
                        required
                      />
                      <div class="invalid-feedback" id="telefonoError"></div>
                    </div>
                  </div>
                </div>

                <div class="mb-3">
                  <label class="form-label fw-bold">Tipo de Cuenta</label>
                  <div class="row g-2">
                    <div class="col-md-4">
                      <div
                        class="form-check card p-3 text-center"
                        style="border-radius: 12px; cursor: pointer"
                      >
                        <input
                          class="form-check-input mx-auto d-block mb-2"
                          type="radio"
                          name="rol"
                          id="rolCliente"
                          value="CLIENTE"
                          th:checked="${usuario == null or usuario.rol == 'CLIENTE'}"
                        />
                        <label
                          class="form-check-label fw-bold"
                          for="rolCliente"
                        >
                          <i
                            class="bi bi-person-badge fs-3 text-primario d-block mb-1"
                          ></i>
                          Cliente
                        </label>
                        <small class="text-muted d-block"
                          >Compra pasajes y envía encomiendas</small
                        >
                      </div>
                    </div>
                    <div class="col-md-4">
                      <div
                        class="form-check card p-3 text-center"
                        style="border-radius: 12px; cursor: pointer"
                      >
                        <input
                          class="form-check-input mx-auto d-block mb-2"
                          type="radio"
                          name="rol"
                          id="rolConductor"
                          value="CONDUCTOR"
                          th:checked="${usuario != null and usuario.rol == 'CONDUCTOR'}"
                        />
                        <label
                          class="form-check-label fw-bold"
                          for="rolConductor"
                        >
                          <i
                            class="bi bi-truck-front fs-3 text-primario d-block mb-1"
                          ></i>
                          Conductor
                        </label>
                        <small class="text-muted d-block"
                          >Postula para trabajar como conductor</small
                        >
                      </div>
                    </div>
                  </div>
                </div>

                <!-- ==================== CAMPOS DE CONDUCTOR (dinámicos) ==================== -->
                <div id="conductorFields" style="display: none;">
                  <hr class="my-4" />
                  <h5 class="fw-bold text-primario mb-3">
                    <i class="bi bi-truck-front me-2"></i>Información del Conductor
                  </h5>
                  <div class="row">
                    <div class="col-md-6 mb-3">
                      <label class="form-label fw-bold">Número de Licencia</label>
                      <div class="input-group">
                        <span class="input-group-text bg-light"
                          ><i class="bi bi-card-text"></i
                        ></span>
                        <input
                          type="text"
                          name="numeroLicencia"
                          class="form-control"
                          maxlength="9"
                          placeholder="Ej: T12345678"
                          id="numeroLicencia"
                        />
                      </div>
                      <div class="invalid-feedback d-block" id="numeroLicenciaError"></div>
                    </div>
                    <div class="col-md-6 mb-3">
                      <label class="form-label fw-bold">Años de Experiencia</label>
                      <div class="input-group">
                        <span class="input-group-text bg-light"
                          ><i class="bi bi-clock-history"></i
                        ></span>
                        <input
                          type="number"
                          name="aniosExperiencia"
                          class="form-control"
                          placeholder="Ej: 5"
                          min="0"
                          max="60"
                          id="aniosExperiencia"
                        />
                        <div class="invalid-feedback d-block" id="aniosExperienciaError"></div>
                      </div>
                    </div>
                  </div>
                  <div class="mb-3">
                    <label class="form-label fw-bold">Tipo de Vehículo</label>
                    <div class="input-group">
                      <span class="input-group-text bg-light"
                        ><i class="bi bi-truck"></i
                      ></span>
                      <select name="tipoVehiculo" class="form-select" id="tipoVehiculo">
                        <option value="">Selecciona un tipo...</option>
                        <option value="Minivan">Minivan</option>
                        <option value="Bus">Bus</option>
                        <option value="Camión">Camión</option>
                        <option value="Automóvil">Automóvil</option>
                      </select>
                      <div class="invalid-feedback d-block" id="tipoVehiculoError"></div>
                    </div>
                  </div>
                  <div class="mb-3">
                    <label class="form-label fw-bold">Subida de Documentos</label>
                    <div class="input-group">
                      <span class="input-group-text bg-light"
                        ><i class="bi bi-file-earmark-pdf"></i
                      ></span>
                      <input
                        type="file"
                        name="documento"
                        class="form-control"
                        accept=".pdf,.jpg,.png"
                        id="documento"
                      />
                      <div class="invalid-feedback d-block" id="documentoError"></div>
                    </div>
                    <small class="text-muted">PDF, JPG o PNG (máx. 5MB)</small>
                  </div>
                </div>

                <div class="row">
                  <div class="col-md-6 mb-3">
                    <label class="form-label fw-bold">Contraseña</label>
                    <div class="input-group">
                      <span class="input-group-text bg-light"
                        ><i class="bi bi-lock"></i
                      ></span>
                      <input
                        id="password"
                        type="password"
                        name="password"
                        class="form-control"
                        placeholder="Mínimo 6 caracteres"
                        required
                      />
                      <div class="invalid-feedback" id="passwordError"></div>
                    </div>
                  </div>
                  <div class="col-md-6 mb-3">
                    <label class="form-label fw-bold"
                      >Confirmar Contraseña</label
                    >
                    <div class="input-group">
                      <span class="input-group-text bg-light"
                        ><i class="bi bi-lock-fill"></i
                      ></span>
                      <input
                        id="confirmarPassword"
                        type="password"
                        name="confirmarPassword"
                        class="form-control"
                        placeholder="Repite tu contraseña"
                        required
                      />
                      <div class="invalid-feedback" id="confirmarPasswordError"></div>
                    </div>
                  </div>
                </div>
                <div class="d-grid">
                  <button type="submit" class="btn btn-amarillo fw-bold" id="btnSubmit">
                    <i class="bi bi-person-plus me-2"></i><span id="btnTexto">Crear Cuenta</span>
                  </button>
                </div>
              </form>
              <div class="text-center mt-3">
                <p class="mb-0">
                  ¿Ya tienes una cuenta?
                  <a href="/login" class="fw-bold text-primario"
                    >Inicia sesión aquí</a
                  >
                </p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div th:replace="~{layout :: footer}"></div>
    <div th:replace="~{layout :: scripts}"></div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="/js/registro/registro.js"></script>

  </body>
</html>
