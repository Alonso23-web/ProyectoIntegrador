<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{layout :: head('Registro - Nueva Ases Express')}"></head>
  <body>
    <div th:replace="~{layout :: navbar}"></div>

    <div class="container my-5">
      <div class="row justify-content-center">
        <div class="col-md-7">
          <div
            class="card shadow-lg border-0"
            style="border-radius: 20px; overflow: hidden"
          >
            <div class="card-header bg-primario text-white text-center py-4">
              <img
                th:src="@{/img/logonuevaases.png}"
                alt="Nueva Ases Express"
                style="
                  height: 60px;
                  background: white;
                  padding: 5px;
                  border-radius: 12px;
                  margin-bottom: 1rem;
                "
                onerror="this.style.display = 'none'"
              />
              <h4 class="mb-0 fw-bold">Crear Cuenta</h4>
              <small class="text-white-50"
                >Regístrate como cliente para comprar pasajes y enviar encomiendas</small
              >
            </div>
            <div class="card-body p-4">
              <div
                th:if="${error}"
                class="alert alert-danger d-flex align-items-center"
              >
                <i class="bi bi-exclamation-triangle-fill me-2"></i>
                <span th:text="${error}"></span>
              </div>

              <form id="formRegistro" th:action="@{/registro}" method="post" enctype="multipart/form-data">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <div class="row">
                  <div class="col-md-6 mb-3">
                    <label class="form-label fw-bold">Nombre Completo</label>
                    <div class="input-group">
                      <span class="input-group-text bg-light"
                        ><i class="bi bi-person"></i
                      ></span>
                      <input
                        id="nombreCompleto"
                        type="text"
                        name="nombreCompleto"
                        class="form-control"
                        th:value="${usuario != null ? usuario.nombreCompleto : ''}"
                        placeholder="Juan Pérez"
                        required
                      />
                      <div class="invalid-feedback" id="nombreCompletoError"></div>
                    </div>
                  </div>
                  <div class="col-md-6 mb-3">
                    <label class="form-label fw-bold">DNI</label>
                    <div class="input-group">
                      <span class="input-group-text bg-light"
                        ><i class="bi bi-card-text"></i
                      ></span>
                      <input
                        id="dni"
                        type="text"
                        name="dni"
                        class="form-control"
                        th:value="${usuario != null ? usuario.dni : ''}"
                        placeholder="12345678"
                        required
                      />
                      <div class="invalid-feedback" id="dniError"></div>
                    </div>
                  </div>
                </div>
                <div class="row">
                  <div class="col-md-6 mb-3">
                    <label class="form-label fw-bold">Correo Electrónico</label>
                    <div class="input-group">
                      <span class="input-group-text bg-light"
                        ><i class="bi bi-envelope"></i
                      ></span>
                      <input
                        id="email"
                        type="email"
                        name="email"
                        class="form-control"
                        th:value="${usuario != null ? usuario.email : ''}"
                        placeholder="correo@ejemplo.com"
                        required
                      />
                      <div class="invalid-feedback" id="emailError"></div>
                    </div>
                  </div>
                  <div class="col-md-6 mb-3">
                    <label class="form-label fw-bold">Teléfono</label>
                    <div class="input-group">
                      <span class="input-group-text bg-light"
                        ><i class="bi bi-telephone"></i
                      ></span>
                      <input
                        id="telefono"
                        type="tel"
                        name="telefono"
                        class="form-control"
                        th:value="${usuario != null ? usuario.telefono : ''}"
                        placeholder="+51 999 888 777"
                        required
                      />
                      <div class="invalid-feedback" id="telefonoError"></div>
                    </div>
                  </div>
                </div>

                <input type="hidden" name="rol" value="CLIENTE" />

                <div class="row">
                  <div class="col-md-6 mb-3">
                    <label class="form-label fw-bold">Contraseña</label>
                    <div class="input-group">
                      <span class="input-group-text bg-light"
                        ><i class="bi bi-lock"></i
                      ></span>
                      <input
                        id="password"
                        type="password"
                        name="password"
                        class="form-control"
                        placeholder="Mínimo 6 caracteres"
                        required
                      />
                      <div class="invalid-feedback" id="passwordError"></div>
                    </div>
                  </div>
                  <div class="col-md-6 mb-3">
                    <label class="form-label fw-bold"
                      >Confirmar Contraseña</label
                    >
                    <div class="input-group">
                      <span class="input-group-text bg-light"
                        ><i class="bi bi-lock-fill"></i
                      ></span>
                      <input
                        id="confirmarPassword"
                        type="password"
                        name="confirmarPassword"
                        class="form-control"
                        placeholder="Repite tu contraseña"
                        required
                      />
                      <div class="invalid-feedback" id="confirmarPasswordError"></div>
                    </div>
                  </div>
                </div>
                <div class="d-grid">
                  <button type="submit" class="btn btn-amarillo fw-bold" id="btnSubmit">
                    <i class="bi bi-person-plus me-2"></i>Crear Cuenta
                  </button>
                </div>
              </form>
              <div class="text-center mt-3">
                <p class="mb-0">
                  ¿Ya tienes una cuenta?
                  <a href="/login" class="fw-bold text-primario"
                    >Inicia sesión aquí</a
                  >
                </p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div th:replace="~{layout :: footer}"></div>
    <div th:replace="~{layout :: scripts}"></div>

    <script src="/js/registro/registro.js"></script>

  </body>
</html>
