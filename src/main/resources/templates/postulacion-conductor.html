<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{layout :: head('Postular como Conductor - Nueva Ases Express')}"></head>
  <body>
    <div th:replace="~{layout :: navbar}"></div>

    <div class="container my-5">
      <div class="row justify-content-center">
        <div class="col-md-7">
          <div class="card shadow-lg border-0" style="border-radius: 20px; overflow: hidden">

            <!-- HEADER -->
            <div class="card-header text-white text-center py-4" style="background: linear-gradient(135deg, #0d1b3e 0%, #1a2d6b 100%);">
              <div style="width:70px;height:70px;border-radius:50%;background:rgba(255,255,255,0.12);display:flex;align-items:center;justify-content:center;margin:0 auto 1rem;font-size:2rem;">
                🚛
              </div>
              <h4 class="mb-0 fw-bold">Postular como Conductor</h4>
              <small class="text-white-50">Únete a nuestro equipo de conductores profesionales</small>
            </div>

            <div class="card-body p-4">

              <!-- Alertas -->
              <div th:if="${error}" class="alert alert-danger d-flex align-items-center rounded-4 border-0">
                <i class="bi bi-exclamation-triangle-fill me-2 fs-5"></i>
                <span th:text="${error}"></span>
              </div>

              <form id="formPostulacion" th:action="@{/postular-conductor}" method="post" enctype="multipart/form-data">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                <!-- ==================== DATOS PERSONALES ==================== -->
                <h5 class="fw-bold text-primario mb-3">
                  <i class="bi bi-person me-2 text-amarillo"></i>Datos Personales
                </h5>

                <div class="row">
                  <div class="col-md-6 mb-3">
                    <label class="form-label fw-bold">Nombre Completo</label>
                    <div class="input-group">
                      <span class="input-group-text bg-light"><i class="bi bi-person"></i></span>
                      <input type="text" name="nombreCompleto" class="form-control" id="nombreCompleto"
                             th:value="${postulacion != null ? postulacion.nombreCompleto : ''}"
                             placeholder="Juan Pérez" required />
                      <div class="invalid-feedback" id="nombreCompletoError"></div>
                    </div>
                  </div>
                  <div class="col-md-6 mb-3">
                    <label class="form-label fw-bold">DNI</label>
                    <div class="input-group">
                      <span class="input-group-text bg-light"><i class="bi bi-card-text"></i></span>
                      <input type="text" name="dni" class="form-control" id="dni"
                             th:value="${postulacion != null ? postulacion.dni : ''}"
                             placeholder="12345678" required maxlength="8" />
                      <div class="invalid-feedback" id="dniError"></div>
                    </div>
                  </div>
                </div>

                <div class="row">
                  <div class="col-md-6 mb-3">
                    <label class="form-label fw-bold">Correo Electrónico</label>
                    <div class="input-group">
                      <span class="input-group-text bg-light"><i class="bi bi-envelope"></i></span>
                      <input type="email" name="email" class="form-control" id="email"
                             th:value="${postulacion != null ? postulacion.email : ''}"
                             placeholder="correo@ejemplo.com" required />
                      <div class="invalid-feedback" id="emailError"></div>
                    </div>
                  </div>
                  <div class="col-md-6 mb-3">
                    <label class="form-label fw-bold">Teléfono</label>
                    <div class="input-group">
                      <span class="input-group-text bg-light"><i class="bi bi-telephone"></i></span>
                      <input type="tel" name="telefono" class="form-control" id="telefono"
                             th:value="${postulacion != null ? postulacion.telefono : ''}"
                             placeholder="+51 999 888 777" required />
                      <div class="invalid-feedback" id="telefonoError"></div>
                    </div>
                  </div>
                </div>

                <hr class="my-4" />

                <!-- ==================== INFORMACIÓN DEL CONDUCTOR ==================== -->
                <h5 class="fw-bold text-primario mb-3">
                  <i class="bi bi-truck-front me-2 text-amarillo"></i>Información Profesional
                </h5>

                <div class="row">
                  <div class="col-md-6 mb-3">
                    <label class="form-label fw-bold">Número de Licencia</label>
                    <div class="input-group">
                      <span class="input-group-text bg-light"><i class="bi bi-card-text"></i></span>
                      <input type="text" name="numeroLicencia" class="form-control" id="numeroLicencia"
                             th:value="${postulacion != null ? postulacion.numeroLicencia : ''}"
                             maxlength="9" placeholder="Ej: T12345678" />
                      <div class="invalid-feedback" id="numeroLicenciaError"></div>
                    </div>
                    <small class="text-muted">Formato: T + 8 dígitos (ej: T12345678)</small>
                  </div>
                  <div class="col-md-6 mb-3">
                    <label class="form-label fw-bold">Años de Experiencia</label>
                    <div class="input-group">
                      <span class="input-group-text bg-light"><i class="bi bi-clock-history"></i></span>
                      <input type="number" name="aniosExperiencia" class="form-control" id="aniosExperiencia"
                             th:value="${postulacion != null ? postulacion.aniosExperiencia : ''}"
                             placeholder="Ej: 5" min="0" max="60" />
                      <div class="invalid-feedback" id="aniosExperienciaError"></div>
                    </div>
                  </div>
                </div>

                <div class="mb-3">
                  <label class="form-label fw-bold">Tipo de Vehículo que manejas</label>
                  <div class="input-group">
                    <span class="input-group-text bg-light"><i class="bi bi-truck"></i></span>
                    <select name="tipoVehiculo" class="form-select" id="tipoVehiculo">
                      <option value="">Selecciona un tipo...</option>
                      <option value="Minivan">Minivan</option>
                      <option value="Bus">Bus</option>
                      <option value="Camión">Camión</option>
                      <option value="Automóvil">Automóvil</option>
                    </select>
                    <div class="invalid-feedback" id="tipoVehiculoError"></div>
                  </div>
                </div>

                <hr class="my-4" />

                <!-- ==================== DOCUMENTOS ==================== -->
                <h5 class="fw-bold text-primario mb-3">
                  <i class="bi bi-file-earmark-text me-2 text-amarillo"></i>Documentos
                </h5>

                <div class="mb-3">
                  <label class="form-label fw-bold">Sube tu CV / Documentos</label>
                  <div class="input-group">
                    <span class="input-group-text bg-light"><i class="bi bi-file-earmark-pdf"></i></span>
                    <input type="file" name="documento" class="form-control" id="documento"
                           accept=".pdf,.jpg,.png" />
                    <div class="invalid-feedback" id="documentoError"></div>
                  </div>
                  <small class="text-muted">PDF, JPG o PNG (máx. 5MB)</small>
                </div>

                <hr class="my-4" />

                <!-- ==================== CONTRASEÑA ==================== -->
                <h5 class="fw-bold text-primario mb-3">
                  <i class="bi bi-lock me-2 text-amarillo"></i>Seguridad
                </h5>

                <div class="row">
                  <div class="col-md-6 mb-3">
                    <label class="form-label fw-bold">Contraseña</label>
                    <div class="input-group">
                      <span class="input-group-text bg-light"><i class="bi bi-lock"></i></span>
                      <input type="password" name="password" class="form-control" id="password"
                             placeholder="Mínimo 6 caracteres" required />
                      <div class="invalid-feedback" id="passwordError"></div>
                    </div>
                  </div>
                  <div class="col-md-6 mb-3">
                    <label class="form-label fw-bold">Confirmar Contraseña</label>
                    <div class="input-group">
                      <span class="input-group-text bg-light"><i class="bi bi-lock-fill"></i></span>
                      <input type="password" name="confirmarPassword" class="form-control" id="confirmarPassword"
                             placeholder="Repite tu contraseña" required />
                      <div class="invalid-feedback" id="confirmarPasswordError"></div>
                    </div>
                  </div>
                </div>

                <div class="d-grid">
                  <button type="submit" class="btn btn-amarillo fw-bold py-2" id="btnSubmit">
                    <i class="bi bi-send me-2"></i>Enviar Postulación
                  </button>
                </div>

                <div class="text-center mt-3">
                  <p class="mb-0">
                    ¿Ya tienes una cuenta?
                    <a href="/login" class="fw-bold text-primario">Inicia sesión aquí</a>
                  </p>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div th:replace="~{layout :: footer}"></div>
    <div th:replace="~{layout :: scripts}"></div>

    <script src="/js/registro/postulacion-conductor.js"></script>

  </body>
</html>
