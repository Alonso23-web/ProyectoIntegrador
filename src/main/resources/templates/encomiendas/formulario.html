<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head
    th:replace="~{layout :: head(${encomienda.id} != null ? 'Editar Encomienda' : 'Nueva Encomienda')}"
  ></head>
  <body>
    <div th:replace="~{layout :: navbar}"></div>
    <div class="container my-4">
      <div class="row justify-content-center">
        <div class="col-md-8">
          <div
            class="card shadow border-0"
            style="border-radius: 16px; overflow: hidden"
          >
            <div class="card-header bg-primario text-white">
              <h4
                class="mb-0 fw-bold"
                th:text="${encomienda.id} != null ? 'Editar Encomienda' : 'Nueva Encomienda'"
              ></h4>
            </div>
            <div class="card-body p-4">
              <form
                th:action="@{/encomiendas/guardar}"
                th:object="${encomienda}"
                method="post"
              >
                <input type="hidden" th:field="*{id}" />
                <input type="hidden" th:field="*{peso}" />
                <input type="hidden" th:field="*{precio}" />
                <input type="hidden" th:field="*{fechaEnvio}" />
                <input type="hidden" th:field="*{fechaEstimadaEntrega}" />
                <input type="hidden" th:field="*{estado}" />
                <input type="hidden" th:field="*{creadoPorEmail}" />
                <div class="mb-3">
                  <label class="form-label fw-bold">Código de Rastreo</label>
                  <input
                    type="text"
                    class="form-control"
                    th:field="*{codigoRastreo}"
                    readonly
                  />
                  <small class="text-muted"
                    >Este código se genera automáticamente</small
                  >
                </div>
                <div class="row">
                  <div class="col-md-6 mb-3">
                    <label class="form-label fw-bold">Remitente</label>
                    <input
                      type="text"
                      class="form-control"
                      th:field="*{remitente}"
                      required
                      oninput="this.value = this.value.replace(/\d/g, '')"
                      title="No ingrese números en el nombre"
                    />
                  </div>
                  <div class="col-md-6 mb-3">
                    <label class="form-label fw-bold">DNI Remitente</label>
                    <input
                      type="text"
                      class="form-control"
                      th:field="*{dniRemitente}"
                      required
                      inputmode="numeric"
                      pattern="\d{8}"
                      maxlength="8"
                      oninput="
                        this.value = this.value.replace(/\D/g, '').slice(0, 8)
                      "
                      title="Ingrese 8 dígitos numéricos"
                    />
                  </div>
                </div>
                <div class="row">
                  <div class="col-md-6 mb-3">
                    <label class="form-label fw-bold">Destinatario</label>
                    <input
                      type="text"
                      class="form-control"
                      th:field="*{destinatario}"
                      required
                      oninput="this.value = this.value.replace(/\d/g, '')"
                      title="No ingrese números en el nombre"
                    />
                  </div>
                  <div class="col-md-6 mb-3">
                    <label class="form-label fw-bold">DNI Destinatario</label>
                    <input
                      type="text"
                      class="form-control"
                      th:field="*{dniDestinatario}"
                      required
                      inputmode="numeric"
                      pattern="\d{8}"
                      maxlength="8"
                      oninput="
                        this.value = this.value.replace(/\D/g, '').slice(0, 8)
                      "
                      title="Ingrese 8 dígitos numéricos"
                    />
                  </div>
                </div>
                <div class="row">
                  <div class="col-md-6 mb-3">
                    <label class="form-label fw-bold">Origen</label>
                    <select class="form-select" th:field="*{origen}" required>
                      <option value="Trujillo">Trujillo</option>
                      <option value="Chepén">Chepén</option>
                      <option value="Pacasmayo">Pacasmayo</option>
                      <option value="San Pedro de Lloc">San Pedro de Lloc</option>
                      <option value="Ciudad de Dios">Ciudad de Dios</option>
                      <option value="Guadalupe">Guadalupe</option>
                    </select>
                  </div>
                  <div class="col-md-6 mb-3">
                    <label class="form-label fw-bold">Destino</label>
                    <select class="form-select" th:field="*{destino}" required>
                      <option value="Chepén">Chepén</option>
                      <option value="Trujillo">Trujillo</option>
                      <option value="Pacasmayo">Pacasmayo</option>
                      <option value="San Pedro de Lloc">San Pedro de Lloc</option>
                      <option value="Ciudad de Dios">Ciudad de Dios</option>
                      <option value="Guadalupe">Guadalupe</option>
                    </select>
                  </div>
                </div>
                <div class="mb-3">
                  <label class="form-label fw-bold">Descripción</label>
                  <textarea
                    class="form-control"
                    th:field="*{descripcion}"
                    rows="2"
                  ></textarea>
                </div>
                <div class="mb-3">
                  <label class="form-label fw-bold">Observaciones</label>
                  <textarea
                    class="form-control"
                    th:field="*{observaciones}"
                    rows="2"
                  ></textarea>
                </div>
                <div class="d-flex gap-2">
                  <button type="submit" class="btn btn-amarillo fw-bold">
                    Guardar
                  </button>
                  <a href="/encomiendas" class="btn btn-outline-secondary"
                    >Cancelar</a
                  >
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div th:replace="~{layout :: footer}"></div>
    <div th:replace="~{layout :: scripts}"></div>
  </body>
</html>
