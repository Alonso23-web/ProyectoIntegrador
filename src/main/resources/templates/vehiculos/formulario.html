<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head
    th:replace="~{layout :: head(${vehiculo.id} != null ? 'Editar Vehículo' : 'Nuevo Vehículo')}"
  ></head>
  <body>
    <div th:replace="~{layout :: navbar}"></div>
    <div class="container my-4">
      <div class="row justify-content-center">
        <div class="col-md-8">
          <div class="card shadow">
            <div class="card-header bg-primario text-white">
              <h4
                class="mb-0 fw-bold"
                th:text="${vehiculo.id} != null ? 'Editar Vehículo' : 'Nuevo Vehículo'"
              >
                Formulario
              </h4>
            </div>
            <div class="card-body p-4">
              <!-- Mensaje general de error -->
              <div id="general-error" class="alert alert-danger d-none" role="alert"></div>

              <form id="vehiculoForm" enctype="multipart/form-data" novalidate>
                <!-- Token CSRF: necesario para peticiones POST de usuarios autenticados -->
                <input type="hidden" name="_csrf" th:value="${_csrf.token}" />
                <input type="hidden" name="id" th:value="${vehiculo.id}" />

                <div class="row">
                  <div class="col-md-6 mb-3">
                    <label class="form-label fw-bold">Placa <span class="text-danger">*</span></label>
                    <input
                      type="text"
                      class="form-control"
                      name="placa"
                      th:value="${vehiculo.placa != null ? vehiculo.placa : ''}"
                      placeholder="Ej: ABC-123"
                    />
                    <div class="invalid-feedback" id="error-placa"></div>
                  </div>
                  <div class="col-md-6 mb-3">
                    <label class="form-label fw-bold">Marca <span class="text-danger">*</span></label>
                    <input
                      type="text"
                      class="form-control"
                      name="marca"
                      th:value="${vehiculo.marca != null ? vehiculo.marca : ''}"
                      placeholder="Ej: Toyota"
                    />
                    <div class="invalid-feedback" id="error-marca"></div>
                  </div>
                </div>

                <div class="row">
                  <div class="col-md-6 mb-3">
                    <label class="form-label fw-bold">Modelo <span class="text-danger">*</span></label>
                    <input
                      type="text"
                      class="form-control"
                      name="modelo"
                      th:value="${vehiculo.modelo != null ? vehiculo.modelo : ''}"
                      placeholder="Ej: Hiace"
                    />
                    <div class="invalid-feedback" id="error-modelo"></div>
                  </div>
                  <div class="col-md-6 mb-3">
                    <label class="form-label fw-bold">Año <span class="text-danger">*</span></label>
                    <input
                      type="number"
                      class="form-control"
                      name="anio"
                      th:value="${vehiculo.anio != null && vehiculo.anio > 0 ? vehiculo.anio : ''}"
                      placeholder="Ej: 2024"
                    />
                    <div class="invalid-feedback" id="error-anio"></div>
                  </div>
                </div>

                <div class="row">
                  <div class="col-md-6 mb-3">
                    <label class="form-label fw-bold">Capacidad (personas) <span class="text-danger">*</span></label>
                    <input
                      type="number"
                      class="form-control"
                      name="capacidad"
                      th:value="${vehiculo.capacidad != null && vehiculo.capacidad > 0 ? vehiculo.capacidad : ''}"
                      placeholder="Ej: 15"
                    />
                    <div class="invalid-feedback" id="error-capacidad"></div>
                  </div>
                  <div class="col-md-6 mb-3">
                    <label class="form-label fw-bold">Precio por Día (S/) <span class="text-danger">*</span></label>
                    <input
                      type="number"
                      step="0.01"
                      class="form-control"
                      name="precioPorDia"
                      th:value="${vehiculo.precioPorDia != null && vehiculo.precioPorDia > 0 ? vehiculo.precioPorDia : ''}"
                      placeholder="Ej: 350.00"
                    />
                    <div class="invalid-feedback" id="error-precioPorDia"></div>
                  </div>
                </div>

                <div class="row">
                  <div class="col-md-6 mb-3">
                    <label class="form-label fw-bold">Tipo <span class="text-danger">*</span></label>
                    <select class="form-select" name="tipo" required>
                      <option value="">Seleccionar...</option>
                      <option value="BUS" th:selected="${vehiculo.tipo == 'BUS'}">Bus</option>
                      <option value="MINIVAN" th:selected="${vehiculo.tipo == 'MINIVAN'}">Minivan</option>
                      <option value="CAMION" th:selected="${vehiculo.tipo == 'CAMION'}">Camión</option>
                      <option value="CAMIONETA" th:selected="${vehiculo.tipo == 'CAMIONETA'}">Camioneta</option>
                      <option value="AUTOMOVIL" th:selected="${vehiculo.tipo == 'AUTOMOVIL'}">Automóvil</option>
                    </select>
                    <div class="invalid-feedback" id="error-tipo"></div>
                  </div>
                  <div class="col-md-6 mb-3">
                    <label class="form-label fw-bold">Estado <span class="text-danger">*</span></label>
                    <select class="form-select" name="estado" required>
                      <option value="">Seleccionar...</option>
                      <option value="DISPONIBLE" th:selected="${vehiculo.estado == 'DISPONIBLE'}">Disponible</option>
                      <option value="ALQUILADO" th:selected="${vehiculo.estado == 'ALQUILADO'}">Alquilado</option>
                      <option value="MANTENIMIENTO" th:selected="${vehiculo.estado == 'MANTENIMIENTO'}">Mantenimiento</option>
                    </select>
                    <div class="invalid-feedback" id="error-estado"></div>
                  </div>
                </div>

                <div class="mb-3">
                  <label class="form-label fw-bold">Imagen del Vehículo</label>
                  <div th:if="${vehiculo.imagen != null and !vehiculo.imagen.isEmpty()}" class="mb-2">
                    <img
                      th:src="${vehiculo.imagen}"
                      alt="Vista previa"
                      class="rounded border"
                      style="max-height: 120px; object-fit: cover"
                    />
                    <div class="small text-muted mt-1">Imagen actual. Sube una nueva para reemplazarla.</div>
                  </div>
                  <input
                    type="file"
                    class="form-control"
                    name="imagenFile"
                    accept="image/png,image/jpeg,image/jpg,image/webp"
                  />
                  <div class="invalid-feedback" id="error-imagenFile"></div>
                  <div class="form-text">Formatos: PNG, JPG, WEBP. Tamaño máximo: 10MB.</div>
                </div>

                <div class="mb-3">
                  <label class="form-label fw-bold">Descripción (opcional)</label>
                  <textarea
                    class="form-control"
                    name="descripcion"
                    rows="3"
                    placeholder="Describe características adicionales del vehículo..."
                    th:text="${vehiculo.descripcion}"></textarea>
                  <div class="invalid-feedback" id="error-descripcion"></div>
                </div>

                <div class="d-flex gap-2">
                  <button type="submit" class="btn btn-amarillo fw-bold" id="btnGuardar">
                    <i class="bi bi-check-lg me-1"></i><span id="btnGuardarText">Guardar</span>
                  </button>
                  <a href="/vehiculos" class="btn btn-outline-secondary">Cancelar</a>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div th:replace="~{layout :: footer}"></div>
    <div th:replace="~{layout :: scripts}"></div>

    <style>
      .invalid-feedback {
        display: none;
        color: #dc3545;
        font-size: 0.85rem;
        margin-top: 0.25rem;
      }
      .invalid-feedback.show {
        display: block;
      }
      .form-control.is-invalid,
      .form-select.is-invalid {
        border-color: #dc3545;
        box-shadow: 0 0 0 0.2rem rgba(220, 53, 69, 0.15);
      }
    </style>

    <script>
      document.addEventListener('DOMContentLoaded', function() {
        const form = document.getElementById('vehiculoForm');
        const btnGuardar = document.getElementById('btnGuardar');
        const btnGuardarText = document.getElementById('btnGuardarText');
        const generalError = document.getElementById('general-error');

        // Limpiar errores al escribir
        form.querySelectorAll('input, select, textarea').forEach(function(el) {
          el.addEventListener('input', function() {
            limpiarError(el.name);
          });
          el.addEventListener('change', function() {
            limpiarError(el.name);
          });
        });

        function limpiarError(campo) {
          const input = form.querySelector('[name="' + campo + '"]');
          const errorEl = document.getElementById('error-' + campo);
          if (input) input.classList.remove('is-invalid');
          if (errorEl) {
            errorEl.classList.remove('show');
            errorEl.textContent = '';
          }
        }

        function mostrarError(campo, mensaje) {
          const input = form.querySelector('[name="' + campo + '"]');
          const errorEl = document.getElementById('error-' + campo);
          if (input) input.classList.add('is-invalid');
          if (errorEl) {
            errorEl.textContent = mensaje;
            errorEl.classList.add('show');
          }
        }

        function mostrarErrores(errors) {
          for (var campo in errors) {
            if (errors.hasOwnProperty(campo)) {
              if (campo === 'general') {
                generalError.textContent = errors[campo];
                generalError.classList.remove('d-none');
              } else {
                mostrarError(campo, errors[campo]);
              }
            }
          }
        }

        function limpiarTodosErrores() {
          form.querySelectorAll('.is-invalid').forEach(function(el) {
            el.classList.remove('is-invalid');
          });
          document.querySelectorAll('.invalid-feedback').forEach(function(el) {
            el.classList.remove('show');
            el.textContent = '';
          });
          generalError.classList.add('d-none');
          generalError.textContent = '';
        }

        // Validación del lado del cliente con reglas exactas del usuario
        function validarCliente() {
          var errores = {};
          var placa = form.querySelector('[name="placa"]').value.trim();
          var marca = form.querySelector('[name="marca"]').value.trim();
          var modelo = form.querySelector('[name="modelo"]').value.trim();
          var anio = form.querySelector('[name="anio"]').value.trim();
          var capacidad = form.querySelector('[name="capacidad"]').value.trim();
          var tipo = form.querySelector('[name="tipo"]').value;
          var estado = form.querySelector('[name="estado"]').value;
          var precio = form.querySelector('[name="precioPorDia"]').value.trim();

          // Placa: no vacía, formato válido
          if (!placa) {
            errores.placa = 'La placa no puede estar vacía.';
          } else if (!/^[A-Za-z0-9-]+$/.test(placa)) {
            errores.placa = 'La placa debe tener un formato válido (solo letras, números y guiones).';
          }

          // Marca: no vacía
          if (!marca) {
            errores.marca = 'La marca no puede estar vacía.';
          }

          // Modelo: no vacío
          if (!modelo) {
            errores.modelo = 'El modelo no puede estar vacío.';
          }

          // Año: número entre 2000 y 2030
          var anioNum = parseInt(anio);
          if (!anio || isNaN(anioNum) || anioNum < 2000 || anioNum > 2030) {
            errores.anio = 'El año debe ser un número entre 2000 y 2030.';
          }

          // Capacidad: número entre 1 y 50
          var capNum = parseInt(capacidad);
          if (!capacidad || isNaN(capNum) || capNum < 1 || capNum > 50) {
            errores.capacidad = 'La capacidad debe ser un número entre 1 y 50.';
          }

          // Tipo: no puede quedar en opción por defecto
          if (!tipo || tipo === '') {
            errores.tipo = 'Selecciona un tipo de vehículo.';
          }

          // Estado: no puede quedar en opción por defecto
          if (!estado || estado === '') {
            errores.estado = 'Selecciona un estado.';
          }

          // Precio: mayor a 0
          var precioNum = parseFloat(precio);
          if (!precio || isNaN(precioNum) || precioNum <= 0) {
            errores.precioPorDia = 'El precio debe ser mayor a 0.';
          }

          return errores;
        }

        // Validar tamaño de imagen antes de enviar
        function validarImagen() {
          var imagenInput = form.querySelector('[name="imagenFile"]');
          if (imagenInput && imagenInput.files && imagenInput.files.length > 0) {
            var file = imagenInput.files[0];
            var maxSize = 10 * 1024 * 1024; // 10MB en bytes
            if (file.size > maxSize) {
              var errorEl = document.getElementById('error-imagenFile');
              var mb = (file.size / (1024 * 1024)).toFixed(1);
              errorEl.textContent = 'La imagen supera los 10MB (' + mb + ' MB). Selecciona una imagen más pequeña.';
              errorEl.classList.add('show');
              imagenInput.classList.add('is-invalid');
              return false;
            }
          }
          return true;
        }

        form.addEventListener('submit', function(e) {
          e.preventDefault();
          limpiarTodosErrores();

          // Validación del lado del cliente
          var clientErrors = validarCliente();
          if (Object.keys(clientErrors).length > 0) {
            mostrarErrores(clientErrors);
            // Scroll al primer error
            var firstError = document.querySelector('.is-invalid');
            if (firstError) firstError.scrollIntoView({ behavior: 'smooth', block: 'center' });
            return;
          }

          // Validar tamaño de imagen antes de enviar
          if (!validarImagen()) {
            return;
          }

          // Enviar por AJAX
          btnGuardar.disabled = true;
          btnGuardarText.textContent = 'Guardando...';

          var formData = new FormData(form);

          fetch('/vehiculos/guardar', {
            method: 'POST',
            body: formData
          })
          .then(function(response) {
            return response.json().then(function(data) {
              return { status: response.status, data: data };
            });
          })
          .then(function(result) {
            if (result.data.success) {
              window.location.href = result.data.redirectUrl || '/vehiculos';
            } else {
              mostrarErrores(result.data.errors || { general: 'Error al guardar el vehículo.' });
              btnGuardar.disabled = false;
              btnGuardarText.textContent = 'Guardar';
            }
          })
          .catch(function(error) {
            generalError.textContent = 'Error de conexión. Intenta nuevamente.';
            generalError.classList.remove('d-none');
            btnGuardar.disabled = false;
            btnGuardarText.textContent = 'Guardar';
          });
        });
      });
    </script>
  </body>
</html>
