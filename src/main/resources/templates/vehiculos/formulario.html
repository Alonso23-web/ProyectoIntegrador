<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head
    th:replace="~{layout :: head(${vehiculo.id} != null ? 'Editar Vehículo' : 'Nuevo Vehículo')}"
  ></head>
  <body>
    <div th:replace="~{layout :: navbar}"></div>
    <div class="container my-4">
      <div class="row justify-content-center">
        <div class="col-md-7">
          <div class="card shadow">
            <div class="card-header bg-primario text-white">
              <h4
                class="mb-0 fw-bold"
                th:text="${vehiculo.id} != null ? 'Editar Vehículo' : 'Nuevo Vehículo'"
              >
                Formulario
              </h4>
            </div>
            <div class="card-body p-4">
              <form
                th:action="@{/vehiculos/guardar}"
                th:object="${vehiculo}"
                method="post"
              >
                <input type="hidden" th:field="*{id}" />
                <div class="row">
                  <div class="col-md-6 mb-3">
                    <label class="form-label fw-bold">Placa</label>
                    <input
                      type="text"
                      class="form-control"
                      th:field="*{placa}"
                      required
                    />
                  </div>
                  <div class="col-md-6 mb-3">
                    <label class="form-label fw-bold">Marca</label>
                    <input
                      type="text"
                      class="form-control"
                      th:field="*{marca}"
                      required
                    />
                  </div>
                </div>
                <div class="row">
                  <div class="col-md-6 mb-3">
                    <label class="form-label fw-bold">Modelo</label>
                    <input
                      type="text"
                      class="form-control"
                      th:field="*{modelo}"
                      required
                    />
                  </div>
                  <div class="col-md-6 mb-3">
                    <label class="form-label fw-bold">Año</label>
                    <input
                      type="number"
                      class="form-control"
                      th:field="*{anio}"
                      required
                    />
                  </div>
                </div>
                <div class="row">
                  <div class="col-md-6 mb-3">
                    <label class="form-label fw-bold">Capacidad</label>
                    <input
                      type="number"
                      class="form-control"
                      th:field="*{capacidad}"
                      required
                    />
                  </div>
                  <div class="col-md-6 mb-3">
                    <label class="form-label fw-bold"
                      >Precio por Día (S/)</label
                    >
                    <input
                      type="number"
                      step="0.01"
                      class="form-control"
                      th:field="*{precioPorDia}"
                      required
                    />
                  </div>
                </div>
                <div class="row">
                  <div class="col-md-6 mb-3">
                    <label class="form-label fw-bold">Tipo</label>
                    <select class="form-select" th:field="*{tipo}" required>
                      <option value="BUS">Bus</option>
                      <option value="MINIVAN">Minivan</option>
                      <option value="CAMION">Camión</option>
                    </select>
                  </div>
                  <div class="col-md-6 mb-3">
                    <label class="form-label fw-bold">Estado</label>
                    <select class="form-select" th:field="*{estado}" required>
                      <option value="DISPONIBLE">Disponible</option>
                      <option value="ALQUILADO">Alquilado</option>
                      <option value="MANTENIMIENTO">Mantenimiento</option>
                    </select>
                  </div>
                </div>
                <div class="mb-3">
                  <label class="form-label fw-bold">URL de Imagen</label>
                  <input
                    type="text"
                    class="form-control"
                    th:field="*{imagen}"
                  />
                </div>
                <div class="d-flex gap-2">
                  <button type="submit" class="btn btn-amarillo fw-bold">
                    <i class="bi bi-check-lg me-1"></i>Guardar
                  </button>
                  <a href="/vehiculos" class="btn btn-outline-secondary"
                    >Cancelar</a
                  >
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div th:replace="~{layout :: footer}"></div>
    <div th:replace="~{layout :: scripts}"></div>
  </body>
</html>
