<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head
    th:replace="~{layout :: head('Detalle de Vehículo - Nueva Ases Express')}"
  ></head>
  <body>
    <div th:replace="~{layout :: navbar}"></div>

    <section class="py-5" style="background: #f0f2f5; min-height: calc(100vh - 130px);">
      <div class="container">
        <div class="mb-3">
          <a href="/vehiculos" class="btn btn-outline-secondary btn-sm">
            <i class="bi bi-arrow-left me-1"></i>Volver a la flota
          </a>
        </div>

        <div class="row g-4">
          <div class="col-lg-5">
            <!-- Imagen -->
            <div class="card shadow-sm border-0" style="border-radius: 20px; overflow: hidden;">
              <div th:if="${vehiculo.imagen != null and !vehiculo.imagen.isEmpty()}">
                <img
                  th:src="${vehiculo.imagen}"
                  alt="Vehículo"
                  style="width: 100%; height: 320px; object-fit: cover;"
                />
              </div>
              <div th:unless="${vehiculo.imagen != null and !vehiculo.imagen.isEmpty()}"
                   style="width: 100%; height: 320px; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #e2e8f0, #cbd5e1); color: #94a3b8; font-size: 5rem;">
                <i class="bi bi-car-front"></i>
              </div>
            </div>
          </div>

          <div class="col-lg-7">
            <div class="card shadow-sm border-0" style="border-radius: 20px;">
              <div class="card-body p-4">
                <!-- Header -->
                <div class="d-flex justify-content-between align-items-start mb-3">
                  <div>
                    <h2 class="fw-bold" style="color: #0d1b3e;" th:text="${vehiculo.marca} + ' ' + ${vehiculo.modelo}">Marca Modelo</h2>
                    <p class="text-muted mb-0">
                      <i class="bi bi-upc-scan me-1 text-amarillo"></i>Placa: <strong th:text="${vehiculo.placa}">ABC-123</strong>
                    </p>
                  </div>
                  <span class="badge fs-6 px-3 py-2"
                        th:classappend="${vehiculo.estado == 'DISPONIBLE'} ? 'bg-success' : (${vehiculo.estado == 'ALQUILADO'} ? 'bg-warning text-dark' : 'bg-danger')"
                        th:text="${vehiculo.estado}"
                        style="border-radius: 50px; font-weight: 700;">
                    ESTADO
                  </span>
                </div>

                <hr />

                <!-- Información -->
                <div class="row g-4">
                  <div class="col-md-6">
                    <div class="d-flex align-items-center gap-3 p-3 rounded-3" style="background: #f8fafc;">
                      <div style="width: 40px; height: 40px; border-radius: 12px; background: #e8f0fe; color: #1967d2; display: flex; align-items: center; justify-content: center; font-size: 1.2rem;">
                        <i class="bi bi-car-front"></i>
                      </div>
                      <div>
                        <div class="text-muted small">Tipo</div>
                        <div class="fw-bold" style="color: #0d1b3e;" th:text="${vehiculo.tipo}">BUS</div>
                      </div>
                    </div>
                  </div>
                  <div class="col-md-6">
                    <div class="d-flex align-items-center gap-3 p-3 rounded-3" style="background: #f8fafc;">
                      <div style="width: 40px; height: 40px; border-radius: 12px; background: #fef7e0; color: #e37400; display: flex; align-items: center; justify-content: center; font-size: 1.2rem;">
                        <i class="bi bi-calendar"></i>
                      </div>
                      <div>
                        <div class="text-muted small">Año</div>
                        <div class="fw-bold" style="color: #0d1b3e;" th:text="${vehiculo.anio}">2024</div>
                      </div>
                    </div>
                  </div>
                  <div class="col-md-6">
                    <div class="d-flex align-items-center gap-3 p-3 rounded-3" style="background: #f8fafc;">
                      <div style="width: 40px; height: 40px; border-radius: 12px; background: #f0fdf4; color: #16a34a; display: flex; align-items: center; justify-content: center; font-size: 1.2rem;">
                        <i class="bi bi-people"></i>
                      </div>
                      <div>
                        <div class="text-muted small">Capacidad</div>
                        <div class="fw-bold" style="color: #0d1b3e;" th:text="${vehiculo.capacidad} + ' personas'">15</div>
                      </div>
                    </div>
                  </div>
                  <div class="col-md-6">
                    <div class="d-flex align-items-center gap-3 p-3 rounded-3" style="background: #f8fafc;">
                      <div style="width: 40px; height: 40px; border-radius: 12px; background: #fef2f2; color: #dc2626; display: flex; align-items: center; justify-content: center; font-size: 1.2rem;">
                        <i class="bi bi-coin"></i>
                      </div>
                      <div>
                        <div class="text-muted small">Precio por día</div>
                        <div class="fw-bold" style="color: #0d1b3e;" th:text="'S/ ' + ${#numbers.formatDecimal(vehiculo.precioPorDia, 1, 2)}">S/ 0.00</div>
                      </div>
                    </div>
                  </div>
                </div>

                <!-- Descripción -->
                <div th:if="${vehiculo.descripcion != null and !vehiculo.descripcion.isEmpty()}" class="mt-4">
                  <h5 class="fw-bold" style="color: #0d1b3e;">
                    <i class="bi bi-info-circle me-1 text-amarillo"></i>Descripción
                  </h5>
                  <p class="text-muted mb-0" th:text="${vehiculo.descripcion}" style="white-space: pre-line;">Descripción del vehículo</p>
                </div>

                <!-- Acciones -->
                <div class="mt-4 d-flex gap-2">
                  <a th:href="@{'/vehiculos/editar/' + ${vehiculo.id}}" class="btn btn-amarillo fw-bold">
                    <i class="bi bi-pencil me-1"></i>Editar
                  </a>
                  <a href="/vehiculos" class="btn btn-outline-secondary">
                    <i class="bi bi-arrow-left me-1"></i>Volver
                  </a>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <div th:replace="~{layout :: footer}"></div>
    <div th:replace="~{layout :: scripts}"></div>
  </body>
</html>
