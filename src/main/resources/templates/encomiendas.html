<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head
    th:replace="~{layout :: head('Encomiendas - Nueva Ases Express')}"
  ></head>
  <body>
    <div th:replace="~{layout :: navbar}"></div>

    <!-- Hero pequeño -->
    <section class="py-5 bg-primario text-white text-center">
      <div class="container">
        <i class="bi bi-box-seam display-4 mb-3"></i>
        <h1 class="fw-bold">Gestión de Encomiendas</h1>
        <p class="text-white-50 fs-5">
          Rastrea, registra, calcula y consulta tus envíos
        </p>
      </div>
    </section>

    <!-- Tabs -->
    <section class="py-5">
      <div class="container">
        <div class="position-relative mb-4">
          <ul class="nav nav-pills gap-2 d-flex justify-content-center" id="encTabs">
            <li class="nav-item">
              <button class="nav-link active btn-tab" data-tab="mis-registros">
                <i class="bi bi-boxes me-1"></i> Mis envíos
              </button>
            </li>
            <li class="nav-item">
              <button class="nav-link btn-tab" data-tab="registrar">
                <i class="bi bi-plus-circle me-1"></i> Registrar envío
              </button>
            </li>
            <li class="nav-item">
              <button class="nav-link btn-tab" data-tab="calcular">
                <i class="bi bi-calculator me-1"></i> Cotizar envío
              </button>
            </li>
            <li class="nav-item">
              <button class="nav-link btn-tab" data-tab="rastrear">
                <i class="bi bi-upc-scan me-1"></i> Rastrear encomienda
              </button>
            </li>
          </ul>
        </div>

        <!-- MIS REGISTROS -->
        <div id="tab-mis-registros" class="tab-panel">
          <div class="card shadow-sm mx-auto" style="max-width: 900px">
            <div class="card-body p-4">
              <h5 class="fw-bold text-primario mb-4">
                <i class="bi bi-list-check text-amarillo me-2"></i>Mis Registros
                de Encomiendas
              </h5>
              <button
                class="btn btn-amarillo mb-3"
                onclick="cargarMisRegistros()"
              >
                <i class="bi bi-arrow-clockwise me-2"></i>Actualizar
              </button>
              <div id="mis-registros-result" class="mt-3">
                <p class="text-muted">
                  Haz clic en "Actualizar" para cargar tus registros.
                </p>
              </div>
            </div>
          </div>
        </div>

        <!-- REGISTRAR -->
        <div id="tab-registrar" class="tab-panel d-none">
          <div class="card shadow-sm mx-auto" style="max-width: 700px">
            <div class="card-body p-4">
              <h5 class="fw-bold text-primario mb-4">
                <i class="bi bi-plus-circle-fill text-amarillo me-2"></i
                >Registrar encomienda
              </h5>
              <div class="row g-3">
                <div class="col-md-6">
                  <label class="form-label fw-semibold">Remitente</label>
                  <input
                    type="text"
                    id="reg-remitente"
                    class="form-control"
                    placeholder="Nombre completo"
                  />
                </div>
                <div class="col-md-6">
                  <label class="form-label fw-semibold">DNI remitente</label>
                  <input
                    type="text"
                    id="reg-dni-rem"
                    class="form-control"
                    placeholder="12345678"
                  />
                </div>
                <div class="col-md-6">
                  <label class="form-label fw-semibold">Destinatario</label>
                  <input
                    type="text"
                    id="reg-destinatario"
                    class="form-control"
                    placeholder="Nombre completo"
                  />
                </div>
                <div class="col-md-6">
                  <label class="form-label fw-semibold">DNI destinatario</label>
                  <input
                    type="text"
                    id="reg-dni-dest"
                    class="form-control"
                    placeholder="87654321"
                  />
                </div>
                <div class="col-md-6">
                  <label class="form-label fw-semibold">Origen</label>
                  <select id="reg-origen" class="form-select">
                    <option>Trujillo</option>
                    <option>Chepén</option>
                    <option>Pacasmayo</option>
                  </select>
                </div>
                <div class="col-md-6">
                  <label class="form-label fw-semibold">Destino</label>
                  <select id="reg-destino" class="form-select">
                    <option>Chepén</option>
                    <option>Trujillo</option>
                    <option>Pacasmayo</option>
                  </select>
                </div>
                <div class="col-md-4">
                  <label class="form-label fw-semibold">Peso (kg)</label>
                  <input
                    type="number"
                    id="reg-peso"
                    class="form-control"
                    placeholder="1.5"
                    min="0.1"
                    step="0.1"
                  />
                </div>
                <div class="col-md-4">
                  <label class="form-label fw-semibold">Descripción</label>
                  <input
                    type="text"
                    id="reg-descripcion"
                    class="form-control"
                    placeholder="Ropa, documentos..."
                  />
                </div>
                <div class="col-md-4">
                  <label class="form-label fw-semibold"
                    >Teléfono contacto</label
                  >
                  <input
                    type="text"
                    id="reg-telefono"
                    class="form-control"
                    placeholder="999888777"
                  />
                </div>
                <div class="col-12">
                  <button
                    class="btn btn-amarillo w-100 fw-bold"
                    onclick="registrar()"
                  >
                    <i class="bi bi-box-seam me-2"></i>Registrar encomienda
                  </button>
                </div>
              </div>
              <div id="reg-result" class="mt-3"></div>
            </div>
          </div>
        </div>

        <!-- COTIZAR / CALCULAR -->
        <div id="tab-calcular" class="tab-panel d-none">
          <div class="card shadow-sm mx-auto" style="max-width: 500px">
            <div class="card-body p-4">
              <h5 class="fw-bold text-primario mb-4">
                <i class="bi bi-calculator-fill text-amarillo me-2"></i>Calcular
                precio de envío
              </h5>
              <div class="row g-3">
                <div class="col-md-6">
                  <label class="form-label fw-semibold">Origen</label>
                  <select id="calc-origen" class="form-select">
                    <option>Trujillo</option>
                    <option>Chepén</option>
                    <option>Pacasmayo</option>
                  </select>
                </div>
                <div class="col-md-6">
                  <label class="form-label fw-semibold">Destino</label>
                  <select id="calc-destino" class="form-select">
                    <option>Chepén</option>
                    <option>Trujillo</option>
                    <option>Pacasmayo</option>
                  </select>
                </div>
                <div class="col-12">
                  <label class="form-label fw-semibold">Peso (kg)</label>
                  <input
                    type="number"
                    id="calc-peso"
                    class="form-control"
                    placeholder="1.5"
                    min="0.1"
                    step="0.1"
                  />
                </div>
                <div class="col-12">
                  <button
                    class="btn btn-amarillo w-100 fw-bold"
                    onclick="calcular()"
                  >
                    <i class="bi bi-currency-dollar me-2"></i>Calcular precio
                  </button>
                </div>
              </div>
              <div id="calc-result" class="mt-3"></div>
            </div>
          </div>
        </div>

        </div>

      </div>
    </section>

    <div th:replace="~{layout :: footer}"></div>
    <div th:replace="~{layout :: scripts}"></div>

    <style>
      .btn-tab {
        border-radius: 50px;
        padding: 8px 20px;
        border: 2px solid #1b2a5e;
        color: #1b2a5e;
        background: transparent;
        font-weight: 600;
      }
      .btn-tab.active {
        background: #f5a623;
        border-color: #f5a623;
        color: #1a0f00;
      }
      .btn-tab:hover:not(.active) {
        background: #1b2a5e;
        color: white;
      }
      .estado-badge {
        font-size: 12px;
        padding: 4px 12px;
        border-radius: 50px;
        font-weight: 600;
      }
      .estado-REGISTRADO {
        background: #e2e8f0;
        color: #475569;
      }
      .estado-EN_TRANSITO {
        background: #fef3c7;
        color: #92400e;
      }
      .estado-EN_DESTINO {
        background: #dbeafe;
        color: #1e40af;
      }
      .estado-ENTREGADO {
        background: #dcfce7;
        color: #166534;
      }
    </style>

    <script th:inline="javascript">
      const API = "/api/encomiendas";

      document.querySelectorAll(".btn-tab").forEach((btn) => {
        btn.addEventListener("click", () => {
          document
            .querySelectorAll(".btn-tab")
            .forEach((b) => b.classList.remove("active"));
          document
            .querySelectorAll(".tab-panel")
            .forEach((p) => p.classList.add("d-none"));
          btn.classList.add("active");
          document
            .getElementById("tab-" + btn.dataset.tab)
            .classList.remove("d-none");
        });
      });

      async function cargarMisRegistros() {
        alerta(
          "mis-registros-result",
          "info",
          '<div class="spinner-border spinner-border-sm me-2"></div> Cargando tus registros...',
        );
        try {
          const r = await fetch(`${API}/mis-registros`);
          if (!r.ok) throw new Error();
          const lista = await r.json();
          if (!lista.length)
            return alerta(
              "mis-registros-result",
              "warning",
              "No tienes encomiendas registradas aún.",
            );
          const filas = lista
            .map(
              (e) => `
                <tr>
                    <td><code>${e.codigoRastreo}</code></td>
                    <td>${e.origen} → ${e.destino}</td>
                    <td>${e.remitente}</td>
                    <td>${e.destinatario}</td>
                    <td>${e.pesoEstimado} kg</td>
                    <td>S/ ${e.costoEstimado.toFixed(2)}</td>
                    <td><span class="estado-badge estado-${e.estado}">${e.estado.replace("_", " ")}</span></td>
                    <td>${e.fechaEnvio || "-"}</td>
                </tr>
            `,
            )
            .join("");
          document.getElementById("mis-registros-result").innerHTML = `
                <div class="table-responsive mt-2">
                    <table class="table table-hover align-middle small">
                        <thead class="table-dark">
                            <tr>
                                <th>Código</th><th>Ruta</th><th>Remitente</th>
                                <th>Destinatario</th><th>Peso</th><th>Precio</th>
                                <th>Estado</th><th>Fecha</th>
                            </tr>
                        </thead>
                        <tbody>${filas}</tbody>
                    </table>
                </div>
            `;
        } catch (e) {
          alerta(
            "mis-registros-result",
            "danger",
            '<i class="bi bi-exclamation-circle me-2"></i>Error al cargar tus registros.',
          );
        }
      }

      // Función unificada para mostrar alertas
      function alerta(id, tipo, html) {
        const el = document.getElementById(id);
        if (el) el.innerHTML = `<div class="alert alert-${tipo} mt-2">${html}</div>`;
      }

      function calcular() {
        const peso = parseFloat(document.getElementById("calc-peso").value) || 0;
        const origen = document.getElementById("calc-origen").value;
        const destino = document.getElementById("calc-destino").value;
        
        if(peso <= 0) return;

        // Lógica de simulación realista
        const tarifaBase = 10.00;
        const precioKg = 2.50;
        const factorDistancia = (origen === destino) ? 0 : 5.00;
        
        const total = (peso > 0) ? (tarifaBase + (peso * precioKg) + factorDistancia) : 0;
        
        alerta("calc-result", "info", `
            <div class="text-center">
                <div class="display-6 fw-bold text-primario">S/ ${total.toFixed(2)}</div>
                <p class="mb-1 text-muted">Costo estimado de envío</p>
                <div class="alert alert-warning py-2 mb-0 small">
                    <i class="bi bi-exclamation-triangle me-2"></i>
                    El costo es referencial y será validado en oficina.
                </div>
            </div>
        `);
      }

      // Agregar listener para cálculo en tiempo real
      document.getElementById("calc-peso").addEventListener("input", calcular);
      document.getElementById("calc-origen").addEventListener("change", calcular);
      document.getElementById("calc-destino").addEventListener("change", calcular);

      // Lógica para registrar encomienda
      async function registrar() {
        const remitente = document.getElementById("reg-remitente").value.trim();
        const dniRemitente = document.getElementById("reg-dni-rem").value.trim();
        const destinatario = document.getElementById("reg-destinatario").value.trim();
        const dniDestinatario = document.getElementById("reg-dni-dest").value.trim();
        const origen = document.getElementById("reg-origen").value;
        const destino = document.getElementById("reg-destino").value;
        const peso = parseFloat(document.getElementById("reg-peso").value);
        const descripcion = document.getElementById("reg-descripcion").value.trim();
        const telefonoContacto = document.getElementById("reg-telefono").value.trim();

        if (!remitente || !dniRemitente || !destinatario || !dniDestinatario || !origen || !destino || isNaN(peso) || peso <= 0 || !descripcion) {
          return alerta("reg-result", "warning", "Por favor, completa todos los campos obligatorios y asegúrate de que el peso sea válido.");
        }

        alerta("reg-result", "info", '<div class="spinner-border spinner-border-sm me-2"></div> Registrando encomienda...');

        const body = {
          remitente: remitente,
          dniRemitente: dniRemitente,
          destinatario: destinatario,
          dniDestinatario: dniDestinatario,
          origen: origen,
          destino: destino,
          pesoEstimado: peso,
          tipoPaquete: descripcion, // Usamos descripción como tipo de paquete
          observaciones: telefonoContacto // Usamos teléfono de contacto como observaciones
        };

        try {
          const r = await fetch(API, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(body),
          });

          if (!r.ok) {
            const errorText = await r.text();
            throw new Error(`Error al registrar: ${errorText}`);
          }

          const d = await r.json();
          alerta(
            "reg-result",
            "success",
            `
                <i class="bi bi-check-circle-fill me-2"></i><strong>Encomienda registrada exitosamente</strong><br>
                Código de rastreo: <strong>${d.codigoRastreo}</strong><br>
                Precio estimado: <strong>S/ ${d.costoEstimado.toFixed(2)}</strong>
            `,
          );
          // Limpiar formulario después de un registro exitoso
          document.getElementById("reg-remitente").value = "";
          document.getElementById("reg-dni-rem").value = "";
          document.getElementById("reg-destinatario").value = "";
          document.getElementById("reg-dni-dest").value = "";
          document.getElementById("reg-peso").value = "";
          document.getElementById("reg-descripcion").value = "";
          document.getElementById("reg-telefono").value = "";

        } catch (e) {
          alerta(
            "reg-result",
            "danger",
            `<i class="bi bi-exclamation-circle me-2"></i>Error al registrar. ${e.message || 'Revisa los datos.'}`,
          );
        }
      }

      // Lógica para rastrear encomienda
      async function rastrear() {
        const codigo = document.getElementById("track-codigo").value.trim();
        if (!codigo)
          return alerta(
            "track-result",
            "warning",
            "Ingresa un código de rastreo.",
          );
        alerta(
          "track-result",
          "info",
          '<div class="spinner-border spinner-border-sm me-2"></div> Buscando...',
        );
        try {
          const r = await fetch(`${API}/${encodeURIComponent(codigo)}`);
          if (!r.ok) throw new Error();
          const d = await r.json();

          // Mapeo de estados para el badge
          let estadoBadgeClass = 'bg-secondary';
          switch (d.estado) {
            case 'REGISTRADO': estadoBadgeClass = 'estado-REGISTRADO'; break;
            case 'VERIFICADO': estadoBadgeClass = 'estado-VERIFICADO'; break; // Asumiendo que VERIFICADO es un estado posible
            case 'EN_TRANSITO': estadoBadgeClass = 'estado-EN_TRANSITO'; break;
            case 'EN_DESTINO': estadoBadgeClass = 'estado-EN_DESTINO'; break; // Asumiendo que EN_DESTINO es un estado posible
            case 'ENTREGADO': estadoBadgeClass = 'estado-ENTREGADO'; break;
          }

          alerta(
            "track-result",
            "success",
            `
                <div class="d-flex justify-content-between align-items-center mb-2">
                    <strong>${d.codigoRastreo}</strong>
                    <span class="estado-badge ${estadoBadgeClass}">${d.estado.replace("_", " ")}</span>
                </div>
                <div class="row g-2 small">
                    <div class="col-6"><i class="bi bi-person me-1"></i><strong>De:</strong> ${d.remitente}</div>
                    <div class="col-6"><i class="bi bi-person-check me-1"></i><strong>Para:</strong> ${d.destinatario}</div>
                    <div class="col-6"><i class="bi bi-arrow-right-circle me-1"></i>${d.origen} → ${d.destino}</div>
                    <div class="col-6"><i class="bi bi-box me-1"></i>${d.pesoEstimado} kg · S/ ${d.costoEstimado.toFixed(2)}</div>
                    ${d.tipoPaquete ? `<div class="col-12"><i class="bi bi-tag me-1"></i>${d.tipoPaquete}</div>` : ""}
                    ${d.fechaEstimadaEntrega ? `<div class="col-12"><i class="bi bi-calendar-check me-1"></i>Entrega estimada: ${d.fechaEstimadaEntrega}</div>` : ""}
                </div>
            `,
          );
        } catch (e) {
          alerta(
            "track-result",
            "danger",
            '<i class="bi bi-exclamation-circle me-2"></i>No se encontró ninguna encomienda con ese código.',
          );
        }
      }

      // Lógica para cargar "Mis Registros"
      async function cargarMisRegistros() {
        alerta(
          "mis-registros-result",
          "info",
          '<div class="spinner-border spinner-border-sm me-2"></div> Cargando tus registros...',
        );
        try {
          const r = await fetch(`${API}/mis-registros`);
          if (!r.ok) throw new Error();
          const lista = await r.json();
          if (!lista.length)
            return alerta(
              "mis-registros-result",
              "warning",
              "No tienes encomiendas registradas aún.",
            );
          const filas = lista
            .map(
              (e) => `
                <tr>
                    <td><code>${e.codigoRastreo}</code></td>
                    <td>${e.origen} → ${e.destino}</td>
                    <td>${e.remitente}</td>
                    <td>${e.destinatario}</td>
                    <td>${e.pesoEstimado} kg</td>
                    <td>S/ ${e.costoEstimado.toFixed(2)}</td>
                    <td><span class="estado-badge estado-${e.estado}">${e.estado.replace("_", " ")}</span></td>
                    <td>${e.fechaEnvio || "-"}</td>
                </tr>
            `,
            )
            .join("");
          document.getElementById("mis-registros-result").innerHTML = `
                <div class="table-responsive mt-2">
                    <table class="table table-hover align-middle small">
                        <thead class="table-dark">
                            <tr>
                                <th>Código</th><th>Ruta</th><th>Remitente</th>
                                <th>Destinatario</th><th>Peso</th><th>Precio</th>
                                <th>Estado</th><th>Fecha</th>
                            </tr>
                        </thead>
                        <tbody>${filas}</tbody>
                    </table>
                </div>
            `;
        } catch (e) {
          alerta(
            "mis-registros-result",
            "danger",
            '<i class="bi bi-exclamation-circle me-2"></i>Error al cargar tus registros.',
          );
        }
      }

      // Inicializar la pestaña activa al cargar la página
      document.addEventListener("DOMContentLoaded", () => {
        const urlParams = new URLSearchParams(window.location.search);
        const activeTab = urlParams.get('tab');
        if (activeTab) {
          const targetButton = document.querySelector(`.btn-tab[data-tab="${activeTab}"]`);
          if (targetButton) {
            targetButton.click();
            if (activeTab === 'mis-registros') {
              cargarMisRegistros();
            } else if (activeTab === 'cotizar') {
              calcular(); // Realizar un cálculo inicial si la pestaña de cotizar está activa
            }
          }
        } else {
          // Si no hay tab en la URL, activar la primera por defecto (Mis Registros)
          document.querySelector('.btn-tab[data-tab="mis-registros"]').click();
        }
      });
    </script>

    <style>
      .btn-tab {
        border-radius: 50px;
        padding: 8px 20px;
        border: 2px solid #1b2a5e;
        color: #1b2a5e;
        background: transparent;
        font-weight: 600;
      }
      .btn-tab.active {
        background: #f5a623;
        border-color: #f5a623;
        color: #1a0f00;
      }
      .btn-tab:hover:not(.active) {
        background: #1b2a5e;
        color: white;
      }
      .estado-badge {
        font-size: 12px;
        padding: 4px 12px;
        border-radius: 50px;
        font-weight: 600;
      }
      .estado-REGISTRADO {
        background: #e2e8f0;
        color: #475569;
      }
      .estado-EN_TRANSITO {
        background: #fef3c7;
        color: #92400e;
      }
      .estado-EN_DESTINO {
        background: #dbeafe;
        color: #1e40af;
      }
      .estado-ENTREGADO {
        background: #dcfce7;
        color: #166534;
      }
    </style>
  </body>
</html>
