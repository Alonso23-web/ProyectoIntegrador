<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{layout :: head('Pasajes - Nueva Ases Express')}"></head>
  <body>
    <div th:replace="~{layout :: navbar}"></div>

    <div class="container my-4">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold text-primario">
          Venta de Pasajes Trujillo - Chepén
        </h2>
        <a href="/pasajes/cliente" class="btn btn-amarillo fw-bold"
          ><i class="bi bi-plus-lg me-1"></i>Nuevo Pasaje</a
        >
      </div>

      <div class="table-responsive">
        <table class="table table-striped table-hover align-middle">
          <thead class="table-dark">
            <tr>
              <th>Pasajero</th>
              <th>DNI</th>
              <th>Fecha</th>
              <th>Hora</th>
              <th>Asiento</th>
              <th>Precio</th>
              <th>Estado</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="p : ${pasajes}">
              <td th:text="${p.nombrePasajero}"></td>
              <td th:text="${p.dni}"></td>
              <td th:text="${p.fechaViaje}"></td>
              <td th:text="${p.horaViaje}"></td>
              <td th:text="${p.asiento}"></td>
              <td>S/ <span th:text="${p.precio}"></span></td>
              <td>
                <span
                  class="badge"
                  th:classappend="${p.estado == 'PAGADO' ? 'bg-success' : (p.estado == 'RESERVADO' ? 'bg-warning' : 'bg-secondary')}"
                  th:text="${p.estado}"
                ></span>
              </td>
              <td>
                <a
                  th:href="@{'/pasajes/editar/' + ${p.id}}"
                  class="btn btn-sm btn-outline-primary"
                  ><i class="bi bi-pencil me-1"></i>Editar</a
                >
                <a
                  th:href="@{'/pasajes/eliminar/' + ${p.id}}"
                  class="btn btn-sm btn-outline-danger"
                  onclick="
                    return confirm('¿Estás seguro de eliminar este pasaje?');
                  "
                  ><i class="bi bi-trash me-1"></i>Eliminar</a
                >
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <div th:replace="~{layout :: footer}"></div>
    <div th:replace="~{layout :: scripts}"></div>
  </body>
</html>
