<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head
    th:replace="~{layout :: head('Gestión de Pasajes - Nueva Ases Express')}"
  ></head>
  <body>
    <div th:replace="~{layout :: navbar}"></div>

    <section
      class="py-4"
      style="background: #f0f2f5; min-height: calc(100vh - 130px)"
    >
      <div class="container-fluid px-4">

        <!-- Header -->
        <div class="d-flex justify-content-between align-items-center mb-4">
          <div>
            <h4 class="fw-bold text-primario mb-0">
              <i class="bi bi-ticket-perforated me-2 text-amarillo"></i>Gestión de Pasajes
            </h4>
            <small class="text-muted"
              >Administra, filtra y actualiza el estado de los pasajes vendidos</small
            >
          </div>
          <a href="/pasajes/nuevo" class="btn btn-amarillo fw-bold">
            <i class="bi bi-plus-circle me-2"></i>Nuevo Pasaje
          </a>
        </div>

        <!-- Filtros -->
        <div class="card border-0 shadow-sm mb-4 rounded-4">
          <div class="card-body p-3">
            <div class="row g-2 align-items-end">
              <div class="col-md-4">
                <label class="form-label small fw-semibold text-muted">Buscar</label>
                <input
                  type="text"
                  id="filtro-buscar"
                  class="form-control"
                  placeholder="Pasajero, DNI, email..."
                />
              </div>
              <div class="col-md-3">
                <label class="form-label small fw-semibold text-muted">Estado</label>
                <select id="filtro-estado" class="form-select">
                  <option value="">Todos los estados</option>
                  <option value="RESERVADO">Reservado</option>
                  <option value="PAGADO">Pagado</option>
                  <option value="CANCELADO">Cancelado</option>
                  <option value="FINALIZADO">Finalizado</option>
                </select>
              </div>
              <div class="col-md-2">
                <label class="form-label small fw-semibold text-muted">Fecha</label>
                <input type="date" id="filtro-fecha" class="form-control" />
              </div>
              <div class="col-md-2">
                <button
                  class="btn btn-outline-secondary w-100"
                  onclick="limpiarFiltros()"
                >
                  <i class="bi bi-x-circle me-1"></i>Limpiar
                </button>
              </div>
            </div>
          </div>
        </div>

        <!-- Tabla -->
        <div class="card border-0 shadow-sm rounded-4">
          <div class="card-body p-0">
            <div class="table-responsive">
              <table
                class="table table-hover align-middle mb-0"
                id="tabla-pasajes"
              >
                <thead style="background: #f8f9fa">
                  <tr>
                    <th class="px-3 py-3 text-muted small fw-bold">PASAJERO</th>
                    <th class="py-3 text-muted small fw-bold">DNI</th>
                    <th class="py-3 text-muted small fw-bold">RUTA</th>
                    <th class="py-3 text-muted small fw-bold">FECHA VIAJE</th>
                    <th class="py-3 text-muted small fw-bold">HORA</th>
                    <th class="py-3 text-muted small fw-bold">ASIENTO</th>
                    <th class="py-3 text-muted small fw-bold">PRECIO</th>
                    <th class="py-3 text-muted small fw-bold">ESTADO</th>
                    <th class="py-3 text-muted small fw-bold">ESTADO VIAJE</th>
                    <th class="py-3 text-muted small fw-bold" style="min-width: 140px">ACCIONES</th>
                  </tr>
                </thead>
                <tbody>
                  <tr
                    th:each="p : ${pasajes}"
                    th:data-pasajero="${p.nombrePasajero}"
                    th:data-dni="${p.dni}"
                    th:data-email="${p.creadoPorEmail}"
                    th:data-estado="${p.estado}"
                    th:data-fecha="${p.fechaViaje}"
                    th:data-viaje-id="${p.viajeId}"
                    th:data-usuario-email="${p.usuarioEmail}"
                    th:data-estado-viaje="${p.estadoViaje}"
                  >
                    <td class="px-3">
                      <div class="fw-semibold" th:text="${p.nombrePasajero}">—</div>
                      <small class="text-muted" th:text="${p.creadoPorEmail}">—</small>
                    </td>
                    <td th:text="${p.dni}">—</td>
                    <td>
                      <span th:text="${p.origen}">Trujillo</span>
                      <i class="bi bi-arrow-right mx-1 text-muted" style="font-size:0.7rem;"></i>
                      <span th:text="${p.destino}">Chepén</span>
                    </td>
                    <td th:text="${p.fechaViaje}">—</td>
                    <td th:text="${p.horaViaje}">—</td>
                    <td>
                      <span class="badge badge-light-blue px-2 py-1" th:text="'#' + ${p.asiento}">#0</span>
                    </td>
                    <td class="fw-semibold text-success">
                      S/ <span th:text="${#numbers.formatDecimal(p.precio, 1, 2)}">12.00</span>
                    </td>
                    <td>
                      <span
                        class="badge-estado"
                        th:classappend="'badge-' + ${#strings.toLowerCase(p.estado)}"
                        th:text="${p.estado}"
                      ></span>
                    </td>
                    <td>
                      <span
                        class="badge-estado"
                        th:if="${p.estadoViaje != null}"
                        th:classappend="'badge-' + ${#strings.toLowerCase(p.estadoViaje)}"
                        th:text="${p.estadoViaje}"
                      ></span>
                      <span th:if="${p.estadoViaje == null}" class="text-muted small">—</span>
                    </td>
                    <td>
                      <div class="d-flex gap-1">
                        <!-- Editar (modal) -->
                        <button
                          class="btn btn-sm btn-outline-secondary"
                          th:attr="data-id=${p.id},
                            data-pasajero=${p.nombrePasajero},
                            data-dni=${p.dni},
                            data-origen=${p.origen},
                            data-destino=${p.destino},
                            data-fecha=${p.fechaViaje},
                            data-hora=${p.horaViaje},
                            data-asiento=${p.asiento},
                            data-precio=${p.precio},
                            data-estado=${p.estado},
                            data-email=${p.creadoPorEmail},
                            data-viaje-id=${p.viajeId},
                            data-usuario-email=${p.usuarioEmail},
                            data-estado-viaje=${p.estadoViaje}"
                          onclick="abrirModalEditar(this)"
                          title="Editar"
                        >
                          <i class="bi bi-pencil"></i>
                        </button>
                        <!-- Cambiar estado rápido -->
                        <div class="dropdown">
                          <button
                            class="btn btn-sm btn-outline-warning dropdown-toggle"
                            type="button"
                            data-bs-toggle="dropdown"
                            title="Cambiar estado"
                          >
                            <i class="bi bi-arrow-repeat"></i>
                          </button>
                          <ul class="dropdown-menu dropdown-menu-end">
                            <li>
                              <form th:action="@{'/pasajes/estado/' + ${p.id}}" method="post" style="display:inline">
                                <input type="hidden" name="estado" value="RESERVADO" />
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                <button type="submit" class="dropdown-item small">
                                  <span class="badge-estado badge-reservado me-2">RESERVADO</span> Marcar
                                </button>
                              </form>
                            </li>
                            <li>
                              <form th:action="@{'/pasajes/estado/' + ${p.id}}" method="post" style="display:inline">
                                <input type="hidden" name="estado" value="PAGADO" />
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                <button type="submit" class="dropdown-item small">
                                  <span class="badge-estado badge-pagado me-2">PAGADO</span> Marcar
                                </button>
                              </form>
                            </li>
                          </ul>
                        </div>
                        <!-- Cambiar estado de viaje rápido -->
                        <div class="dropdown">
                          <button
                            class="btn btn-sm btn-outline-info dropdown-toggle"
                            type="button"
                            data-bs-toggle="dropdown"
                            title="Cambiar estado de viaje"
                          >
                            <i class="bi bi-geo-alt"></i>
                          </button>
                          <ul class="dropdown-menu dropdown-menu-end">
                            <li>
                              <form th:action="@{'/pasajes/estado-viaje/' + ${p.id}}" method="post" style="display:inline">
                                <input type="hidden" name="estadoViaje" value="EN_VIAJE" />
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                <button type="submit" class="dropdown-item small">
                                  <span class="badge-estado badge-en-viaje me-2">EN VIAJE</span> Marcar
                                </button>
                              </form>
                            </li>
                            <li>
                              <form th:action="@{'/pasajes/estado-viaje/' + ${p.id}}" method="post" style="display:inline">
                                <input type="hidden" name="estadoViaje" value="LLEGO" />
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                <button type="submit" class="dropdown-item small">
                                  <span class="badge-estado badge-llego me-2">LLEG&Oacute;</span> Marcar
                                </button>
                              </form>
                            </li>
                          </ul>
                        </div>
                        <!-- Eliminar -->
                        <a
                          th:href="@{'/pasajes/eliminar/' + ${p.id}}"
                          class="btn btn-sm btn-outline-danger"
                          onclick="return confirm('¿Eliminar este pasaje?')"
                        >
                          <i class="bi bi-trash"></i>
                        </a>
                      </div>
                    </td>
                  </tr>
                  <tr th:if="${#lists.size(pasajes) == 0}">
                    <td colspan="10" class="text-center text-muted py-5">
                      <i class="bi bi-inbox display-6 d-block mb-2"></i>
                      No hay pasajes registrados.
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- Modal: Editar Pasaje -->
    <div class="modal fade" id="modalEditarPasaje" tabindex="-1">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content rounded-4 border-0 shadow">
          <div class="modal-header border-0 pb-0">
            <h5 class="modal-title fw-bold text-primario">
              <i class="bi bi-pencil me-2 text-amarillo"></i>Editar Pasaje
            </h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <form th:action="@{/pasajes/guardar}" method="post">
            <div class="modal-body">
              <input type="hidden" name="id" id="modal-id" />
              <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
              <div class="row g-3">
                <div class="col-md-6">
                  <label class="form-label small fw-semibold">Pasajero</label>
                  <input type="text" name="nombrePasajero" id="modal-pasajero" class="form-control" required />
                </div>
                <div class="col-md-6">
                  <label class="form-label small fw-semibold">DNI</label>
                  <input type="text" name="dni" id="modal-dni" class="form-control" required />
                </div>
                <div class="col-md-6">
                  <label class="form-label small fw-semibold">Origen</label>
                  <input type="text" name="origen" id="modal-origen" class="form-control" readonly />
                </div>
                <div class="col-md-6">
                  <label class="form-label small fw-semibold">Destino</label>
                  <input type="text" name="destino" id="modal-destino" class="form-control" readonly />
                </div>
                <div class="col-md-12">
                  <label class="form-label small fw-semibold">Fecha viaje</label>
                  <input type="date" name="fechaViaje" id="modal-fecha" class="form-control" />
                </div>
                <input type="hidden" name="horaViaje" id="modal-hora" />
                <input type="hidden" name="asiento" id="modal-asiento" />
                <div class="col-md-6">
                  <label class="form-label small fw-semibold">Precio (S/)</label>
                  <input type="number" name="precio" id="modal-precio" class="form-control" step="0.50" />
                </div>
                <div class="col-md-6">
                  <label class="form-label small fw-semibold">Estado</label>
                  <select name="estado" id="modal-estado" class="form-select">
                    <option value="RESERVADO">Reservado</option>
                    <option value="PAGADO">Pagado</option>
                  </select>
                </div>
                <div class="col-md-6">
                  <label class="form-label small fw-semibold">Estado de Viaje</label>
                  <select name="estadoViaje" id="modal-estado-viaje" class="form-select">
                    <option value="">Sin definir</option>
                    <option value="EN_VIAJE">En Viaje</option>
                    <option value="LLEGO">Lleg&oacute;</option>
                  </select>
                </div>
                <input type="hidden" name="creadoPorEmail" id="modal-email" />
                <input type="hidden" name="viajeId" id="modal-viaje-id" />
                <input type="hidden" name="usuarioEmail" id="modal-usuario-email" />
              </div>
            </div>
            <div class="modal-footer border-0">
              <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
              <button type="submit" class="btn btn-amarillo fw-bold">
                <i class="bi bi-check-circle me-1"></i>Guardar cambios
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <div th:replace="~{layout :: footer}"></div>
    <div th:replace="~{layout :: scripts}"></div>

    <style>
      .badge-estado {
        font-size: 0.7rem;
        padding: 0.3rem 0.8rem;
        border-radius: 50px;
        font-weight: 600;
      }
      .badge-reservado { background: #fef7e0; color: #e37400; }
      .badge-pagado { background: #e6f4ea; color: #1e8e3e; }
      .badge-cancelado { background: #fce8e6; color: #d93025; }
      .badge-finalizado { background: #e8f0fe; color: #1967d2; }
      .badge-en-viaje { background: #fff3e0; color: #e65100; }
      .badge-llego { background: #e8f5e9; color: #2e7d32; }
      .badge-light-blue {
        background: rgba(13,27,62,0.08);
        color: #0d1b3e;
        font-weight: 700;
      }
    </style>

    <script>
      document.getElementById("filtro-buscar").addEventListener("input", filtrar);
      document.getElementById("filtro-estado").addEventListener("change", filtrar);
      document.getElementById("filtro-fecha").addEventListener("change", filtrar);

      function filtrar() {
        const buscar = document.getElementById("filtro-buscar").value.toLowerCase();
        const estado = document.getElementById("filtro-estado").value.toUpperCase();
        const fecha = document.getElementById("filtro-fecha").value;

        document.querySelectorAll("#tabla-pasajes tbody tr[data-pasajero]").forEach(tr => {
          const pasajero = (tr.dataset.pasajero || "").toLowerCase();
          const dni = (tr.dataset.dni || "").toLowerCase();
          const email = (tr.dataset.email || "").toLowerCase();
          const trEstado = (tr.dataset.estado || "").toUpperCase();
          const trFecha = tr.dataset.fecha || "";

          const coincideBuscar = !buscar ||
            pasajero.includes(buscar) ||
            dni.includes(buscar) ||
            email.includes(buscar);

          const coincideEstado = !estado || trEstado === estado;
          const coincideFecha = !fecha || trFecha === fecha;

          tr.style.display = (coincideBuscar && coincideEstado && coincideFecha) ? "" : "none";
        });
      }

      function limpiarFiltros() {
        document.getElementById("filtro-buscar").value = "";
        document.getElementById("filtro-estado").value = "";
        document.getElementById("filtro-fecha").value = "";
        filtrar();
      }

      function abrirModalEditar(btn) {
        document.getElementById("modal-id").value = btn.dataset.id;
        document.getElementById("modal-pasajero").value = btn.dataset.pasajero || "";
        document.getElementById("modal-dni").value = btn.dataset.dni || "";
        document.getElementById("modal-origen").value = btn.dataset.origen || "Trujillo";
        document.getElementById("modal-destino").value = btn.dataset.destino || "Chepén";
        document.getElementById("modal-fecha").value = btn.dataset.fecha || "";
        document.getElementById("modal-hora").value = btn.dataset.hora || "";
        document.getElementById("modal-asiento").value = btn.dataset.asiento || "";
        document.getElementById("modal-precio").value = btn.dataset.precio || "12.00";
        document.getElementById("modal-estado").value = btn.dataset.estado || "RESERVADO";
        document.getElementById("modal-email").value = btn.dataset.email || "";
        document.getElementById("modal-viaje-id").value = btn.dataset.viajeId || "";
        document.getElementById("modal-usuario-email").value = btn.dataset.usuarioEmail || "";
        document.getElementById("modal-estado-viaje").value = btn.dataset.estadoViaje || "";

        new bootstrap.Modal(document.getElementById("modalEditarPasaje")).show();
      }
    </script>
  </body>
</html>
